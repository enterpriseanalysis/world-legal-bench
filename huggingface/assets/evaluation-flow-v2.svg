    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #187e70" x="35.3088" y="164.57661" transform="rotate(-0 35.3088 164.57661)">01  QUESTION</text>
   </g>
   <g id="text_2">
    <text style="font-size: 13.5px; font-family: 'DejaVu Sans'; fill: #203d50" transform="translate(35.3088 195.744926)">Legal scenario</text>
    <text style="font-size: 13.5px; font-family: 'DejaVu Sans'; fill: #203d50" transform="translate(35.3088 215.277739)">+ four choices</text>
   </g>
   <g id="text_3">
    <text style="font-size: 8.7px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #657687" x="35.3088" y="246.51171" transform="rotate(-0 35.3088 246.51171)">Authored test language</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #168394" x="251.8128" y="164.57661" transform="rotate(-0 251.8128 164.57661)">02  MODEL</text>
   </g>
   <g id="text_5">
    <text style="font-size: 13.5px; font-family: 'DejaVu Sans'; fill: #203d50" transform="translate(251.8128 195.744926)">One independent</text>
    <text style="font-size: 13.5px; font-family: 'DejaVu Sans'; fill: #203d50" transform="translate(251.8128 213.969926)">single-turn request</text>
   </g>
   <g id="text_6">
    <text style="font-size: 8.7px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #657687" x="251.8128" y="246.51171" transform="rotate(-0 251.8128 246.51171)">No retrieval or agent tools</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #8270b5" x="468.3168" y="164.57661" transform="rotate(-0 468.3168 164.57661)">03  PARSER</text>
   </g>
   <g id="text_8">
    <text style="font-size: 13.5px; font-family: 'DejaVu Sans'; fill: #203d50" transform="translate(468.3168 195.744926)">Unique final</text>
    <text style="font-size: 13.5px; font-family: 'DejaVu Sans'; fill: #203d50" transform="translate(468.3168 214.469848)">A, B, C or D</text>
   </g>
   <g id="text_9">
    <text style="font-size: 8.7px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #657687" x="468.3168" y="246.51171" transform="rotate(-0 468.3168 246.51171)">Multilingual answer extraction</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #bc7444" x="684.8208" y="164.57661" transform="rotate(-0 684.8208 164.57661)">04  SCORE</text>
   </g>
   <g id="text_11">
    <text style="font-size: 13.5px; font-family: 'DejaVu Sans'; fill: #203d50" transform="translate(684.8208 195.744926)">Compare choice</text>
    <text style="font-size: 13.5px; font-family: 'DejaVu Sans'; fill: #203d50" transform="translate(684.8208 213.969926)">with reference key</text>
   </g>
   <g id="text_12">
    <text style="font-size: 8.7px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #657687" x="684.8208" y="246.51171" transform="rotate(-0 684.8208 246.51171)">Country accuracy + macro score</text>
   </g>
   <g id="text_13">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #657687" x="25.5312" y="291.26088" transform="rotate(-0 25.5312 291.26088)">Gold answers are used by the scorer only.</text>
   </g>
   <g id="text_14">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #657687" x="25.5312" y="317.10195" transform="rotate(-0 25.5312 317.10195)">Invalid and failed-inference responses remain unsuccessful; conflicting final choices are not guessed.</text>
   </g>
  </g>
  <g id="text_15">
   <text style="font-weight: 700; font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #163247" x="21.6" y="20.304" transform="rotate(-0 21.6 20.304)">One question. One final choice. Deterministic scoring.</text>
  </g>
  <g id="text_16">
   <text style="font-size: 11.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #5c6c7d" x="21.6" y="45.684" transform="rotate(-0 21.6 45.684)">Closed-book evaluation; source annotations and gold answers remain outside model input.</text>
